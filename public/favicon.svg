<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    .bg { fill: #f4f5f7; }
    .ring { fill: none; stroke: #2563eb; }
    .dot { fill: #2563eb; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #100f0d; }
      .ring { stroke: #8ab4f8; }
      .dot { fill: #8ab4f8; }
    }
  </style>
  <rect class="bg" width="32" height="32" rx="8"/>
  <circle class="ring" cx="16" cy="16" r="7" stroke-width="1.7"/>
  <circle class="dot" cx="16" cy="16" r="2.2"/>
</svg>
